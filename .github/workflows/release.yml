name: release

# Builds the portable Windows bundle and attaches it to a GitHub Release.
# Trigger: push a tag like v0.9.0, or run manually from the Actions tab.
#
# The build itself lives in packaging/build.ps1 so that a local build and a
# release build run identical steps (freeze -> smoke test -> zip).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the build to (e.g. v0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + packager
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Verify the app imports before freezing
        env:
          ECHONOTE_SKIP_PRELOAD: "1"
        run: python -c "from app.main import app; print(app.version)"

      - name: Build, smoke test and zip
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $ver = $tag -replace '^v', ''
          ./packaging/build.ps1 -Version $ver
          "ASSET=EchoNote-v$ver-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            ## 下载后怎么用

            1. 下载 `${{ env.ASSET }}`，解压到任意**可写目录**（例如 `D:\EchoNote`，不要放 `C:\Program Files`）
            2. **先双击 `fetch-model.bat`** 准备模型（实时字幕 145 MB + 定稿 464 MB，自动走国内镜像，只需一次）
            3. 双击 `EchoNote.exe`，会打开一个**独立的应用窗口**（没有地址栏和标签页），点麦克风开始录音
            4. 关闭应用窗口即退出；后台进程会在几秒后自行结束

            模型放进 `models\` 之后**识别全程零联网**。需要硬保证不联网时：

            ```
            EchoNote.exe --offline
            ```

            排查环境问题：

            ```
            EchoNote.exe --self-test
            ```

            全程本地识别，音频不上传任何服务器。

            ### v0.12.0：边录边落盘 + 回放 + sherpa 后端

            **1. 录音不再只在内存里。** v0.11.x 全在内存 ArrayBuffer，录两小时容易崩。v0.12 改成 OPFS（Origin Private File System）边录边落盘：每 0.6 秒切一段 PCM 异步写盘，落盘和识别解耦。出 WAV / SRT / Markdown 时流式导出。

            **2. 回放 + 字幕 seek。** 点时间戳跳转、字幕波形同步高亮、30 秒窗口解码（一次只读 0.96MB Int16 PCM）。性能优化：`PcmLedger` 字节记账 O(1) 累加，波形几何缓存 + 30fps 上限。

            **3. sherpa-onnx 流式后端。** 新增 zipformer int8（161MB，不依赖语言模型）：

            | 后端 | 单句耗时 | rtf | 中文 |
            |------|---------|-----|------|
            | sherpa zipformer | 1.12s | 0.126 | 逐字正确 |
            | whisper base | 0.97s | 0.109 | CER 51.7% |
            | whisper large-v3-turbo | ~22s | 2.48 | 准 |

            可拼写热词走 `modified_beam_search`，否则 greedy。同时接入**远程识别**（OpenAI 兼容 API），**默认关闭**+严格模式，音频出本机必须明确同意。

            **4. 三轮尾音修复。** 一句话最后 1–3 个字符曾被静默丢弃。根因三处：VAD_TAIL_KEEP_MS 150ms→1000ms、平均 RMS 判静音失效改用峰值判断、`covers_end` 比到 `duration_s` 而非 `end_s`；再加 `_SHRINK_GUARD` 前缀判据拒绝二次解码截短。全量 pytest 221 passed。

            **5. 兼容性。** OPFS `move()` 只有 Chrome 有，Firefox/Safari 走 `createWritable()` + 流式拷贝改名。Windows SAPI 原生后端放弃（不支持文件流输入）。

            首字 2.8 s 卡在「2 秒缓冲 + 一次解码」的物理下限；想更快只能换更强的 CPU。

            > 这是 v0.12.0 技术预览版。A/B/C 档 p95 门禁仍未达标，详见 README「延迟口径」。
