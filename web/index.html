<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EchoNote 声记 · 本地实时录音转写</title>
    <meta
      name="description"
      content="EchoNote 声记：完全本地运行的录音与实时语音转文字工具，支持中文/英文/多语言，录音、转写、导出一步完成。"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>EchoNote <span>声记</span></h1>
          <p>本地录音 · 实时转写</p>
        </div>
      </div>

      <div class="top-status">
        <span class="pill" id="conn-pill"><i class="dot"></i><span>连接中</span></span>
        <span class="pill" id="model-pill"><i class="dot"></i><span>模型加载中</span></span>
        <a class="gh-link" href="https://github.com/Qsianuo/echonote" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
          </svg>
          GitHub
        </a>
      </div>
    </header>

    <main class="layout">
      <!-- ───────────────────────── 录音控制 ───────────────────────── -->
      <section class="panel control-panel">
        <div class="panel-head">
          <h2>录音控制</h2>
          <span class="tag" id="model-tag">small</span>
        </div>

        <div class="recorder">
          <button id="record-btn" class="record-btn" disabled aria-label="开始录音">
            <svg class="icon-mic" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="9" y="2.5" width="6" height="11" rx="3" />
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" />
            </svg>
            <svg class="icon-stop" viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
              <rect x="6.5" y="6.5" width="11" height="11" rx="2.2" />
            </svg>
          </button>
          <div class="timer" id="timer">00:00</div>
          <div class="hint" id="hint">正在准备模型…</div>
        </div>

        <canvas id="waveform" height="92" aria-hidden="true"></canvas>

        <div class="settings">
          <label class="field">
            <span>识别语言</span>
            <select id="language" disabled>
              <option value="auto">自动识别</option>
            </select>
          </label>

          <div class="local-note">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="10" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
            <span>录音与识别均在本机完成，不上传云端</span>
          </div>
        </div>
      </section>

      <!-- ───────────────────────── 实时转写 ───────────────────────── -->
      <section class="panel transcript-panel">
        <div class="panel-head">
          <h2>实时转写</h2>
          <div class="actions">
            <button id="copy-btn" class="btn ghost" title="复制全部文字">复制</button>
            <button id="clear-btn" class="btn ghost" title="清空转写内容">清空</button>
            <div class="export">
              <button id="export-btn" class="btn ghost" title="导出">
                导出
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                  <path d="m6 9 6 7 6-7" />
                </svg>
              </button>
              <div class="menu" id="export-menu" hidden>
                <button data-format="wav">WAV 录音</button>
                <button data-format="txt">TXT 文本</button>
                <button data-format="md">Markdown</button>
                <button data-format="srt">SRT 字幕</button>
              </div>
            </div>
          </div>
        </div>

        <div class="transcript" id="transcript">
          <div class="empty" id="empty-state">
            <div class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" />
              </svg>
            </div>
            <p>点击左侧麦克风开始录音</p>
            <span>文字会实时出现在这里 · 支持中英文混合识别</span>
          </div>
          <div id="finals"></div>
          <div class="partial" id="partial" hidden>
            <span class="partial-text"></span><span class="cursor"></span>
          </div>
        </div>

        <div class="panel-foot">
          <span><kbd>空格</kbd> 开始 / 停止</span>
          <span>模型 <b id="footer-model">small</b> · 本地推理</span>
        </div>
      </section>
    </main>

    <footer class="page-foot">
      <span>EchoNote · MIT License · 完全本地运行</span>
      <span class="sep">·</span>
      <a href="https://github.com/Qsianuo/echonote" target="_blank" rel="noreferrer">GitHub</a>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
