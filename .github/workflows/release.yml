name: release

# Builds the portable Windows bundle and attaches it to a GitHub Release.
# Trigger: push a tag like v0.9.0, or run manually from the Actions tab.
#
# The build itself lives in packaging/build.ps1 so that a local build and a
# release build run identical steps (freeze -> smoke test -> zip).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the build to (e.g. v0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + packager
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Verify the app imports before freezing
        env:
          ECHONOTE_SKIP_PRELOAD: "1"
        run: python -c "from app.main import app; print(app.version)"

      - name: Build, smoke test and zip
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $ver = $tag -replace '^v', ''
          ./packaging/build.ps1 -Version $ver
          "ASSET=EchoNote-v$ver-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            ## 下载后怎么用

            1. 下载 `${{ env.ASSET }}`，解压到任意**可写目录**（例如 `D:\EchoNote`，不要放 `C:\Program Files`）
            2. **先双击 `fetch-model.bat`** 准备模型（实时字幕 145 MB + 定稿 1.5 GB，自动走国内镜像，只需一次）
            3. 双击 `EchoNote.exe`，会打开一个**独立的应用窗口**（没有地址栏和标签页），点麦克风开始录音
            4. 关闭应用窗口即退出；后台进程会在几秒后自行结束

            模型放进 `models\` 之后**识别全程零联网**。需要硬保证不联网时：

            ```
            EchoNote.exe --offline
            ```

            排查环境问题：

            ```
            EchoNote.exe --self-test
            ```

            全程本地识别，音频不上传任何服务器。

            ### v0.12.1：像个软件，而不是个网页

            **1. 独立应用窗口。** 之前是浏览器标签页——有地址栏、有标签页、任务栏是浏览器图标。现在用 Edge/Chrome 的 `--app` 打开，没有浏览器边框。找不到浏览器时自动回落成普通标签页。

            **2. 不再挂一个黑框控制台。** 双击 exe 只有窗口；从 `fetch-model.bat` 启动时控制台保留，下载进度照常可见。启动失败会弹原生错误框，日志写在 `logs\echonote.log`。

            **3. 第二次双击不再开新窗口**，而是把已有窗口调到前台。**4. 自有图标**，任务栏和资源管理器不再显示通用图标。**5. 可安装**：窗口右上角「…」→ 应用 → 将此站点作为应用安装。

            ### v0.12.1：录音音量

            之前录音偏小，是 `getUserMedia` 的 `autoGainControl` 在管——它是给通话调的，会随手压回去，而且不可观测。现在关掉它，在录音线程里做**有界自动增益**：

            - 只放大不衰减，上限 **+30 dB**，目标峰值 -1.9 dBFS，硬限 0.95 不回绕
            - 判定按**本机底噪**而不是绝对电平：高于底噪约 8 dB 才算语音，房间安静就多给，房间吵就少给
            - 停顿期间不放大，避免把嘶声抬到 VAD 门限之上（那会让解码器对着静音空转）

            | 原始音量 | 处理后 | 提升 |
            |---|---|---|
            | -5.2 dBFS（正常） | -1.9 dBFS | +3.3 dB |
            | -17.3 dBFS（偏小） | -1.9 dBFS | +15.3 dB |
            | -25.2 dBFS（很小） | -1.9 dBFS | +23.3 dB |
            | -37.3 dBFS（极小） | -7.3 dBFS | +29.9 dB |

            ### v0.12.1：两个会让新用户直接卡住的 bug

            **全新安装永远下不了模型。** 首次加载时，代码先判定「不在盘上，允许一次性下载」，紧接着把 `HF_HUB_OFFLINE=1` 塞进环境——那次下载必然失败，用户看到的是「明明联网却报离线」。只有 `fetch-model.bat` 能用，应用内下载这条路径一直是死的。现在只有模型已在盘上才设离线标志。

            **后端选择不持久化。** 模型选择存在 `models/choice.txt` 里，后端选择却只认环境变量。换一个终端、或双击 exe 启动，就无声退回本地推理，而界面仍显示你选的引擎，CPU 一路满载。现在后端选择写进 `models/asr-backend.txt`，缺 API Key 直接报错，不再静默降级。

            ### v0.12.1：远程定稿 + 本地字幕（混合模式）

            实时字幕是唯一不适合走网络的一环：每 0.6 秒就要重传整段增长中的缓冲，一句话上传几十遍。实测约 46 次/分钟，2000 次/日的免费额度约 43 分钟烧完，而且远端慢时每步还要先等满超时才回退。

            现在把 `remote` 写进 `models/asr-backend.txt` 只切定稿：字幕留在本地 zipformer，定稿走你的 OpenAI 兼容端点。请求量从约 46 次/分钟降到约 1 次/分钟。要让字幕也上云，显式设 `ECHONOTE_ASR_REMOTE_ONLY=1`。

            ### 沿用 v0.12.0：边录边落盘 + 回放 + sherpa 后端

            OPFS 边录边落盘，录音期间内存与时长无关；回放按 30 秒窗口解码，点字幕跳转；sherpa-onnx zipformer int8（161 MB，不依赖语言模型）。三轮尾音修复：一句话最后 1–3 个字符曾被静默丢弃。

            | 后端 | 单句耗时 | rtf |
            |------|---------|-----|
            | sherpa zipformer | 1.12s | 0.126 |
            | whisper base | 0.97s | 0.109 |
            | whisper large-v3-turbo | ~22s | 2.48 |

            首字 2.8 s 卡在「2 秒缓冲 + 一次解码」的物理下限；想更快只能换更强的 CPU。

            > 这是 v0.12.1 技术预览版。A/B/C 档 p95 门禁仍未达标，详见 README「延迟口径」。
