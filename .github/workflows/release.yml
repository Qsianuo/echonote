name: release

# Builds the portable Windows bundle and attaches it to a GitHub Release.
# Trigger: push a tag like v0.9.0, or run manually from the Actions tab.
#
# The build itself lives in packaging/build.ps1 so that a local build and a
# release build run identical steps (freeze -> smoke test -> zip).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the build to (e.g. v0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + packager
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Verify the app imports before freezing
        env:
          ECHONOTE_SKIP_PRELOAD: "1"
        run: python -c "from app.main import app; print(app.version)"

      - name: Build, smoke test and zip
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $ver = $tag -replace '^v', ''
          ./packaging/build.ps1 -Version $ver
          "ASSET=EchoNote-v$ver-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            ## 下载后怎么用

            1. 下载 `${{ env.ASSET }}`，解压到任意**可写目录**（例如 `D:\EchoNote`，不要放 `C:\Program Files`）
            2. **先双击 `fetch-model.bat`** 准备模型（默认高精度档约 1.6 GB，自动走国内镜像，只需一次）
            3. 双击 `EchoNote.exe`，浏览器自动打开，点麦克风开始录音
            4. 关闭命令行窗口即退出

            模型放进 `models\` 之后**识别全程零联网**。需要硬保证不联网时：

            ```
            EchoNote.exe --offline
            ```

            排查环境问题：

            ```
            EchoNote.exe --self-test
            ```

            全程本地识别，音频不上传任何服务器。

            ### 这一版的模型变化

            默认模型从 `small`（464 MB）换成 `large-v3-turbo`（1.6 GB）：同一段样例里
            `small` 把「实时」听成「时时」，turbo 正确，字符错误率 17.2% → 13.8%。

            代价是速度。4 核 CPU 上 turbo 整段 RTF 1.49、3 秒句子折算 4.0，字幕会落后于说话。
            界面上会直接显示「比说话慢约 N 倍」；在「识别模型」里可一键切到「快速」档
            （需先 `EchoNote.exe --fetch-model small`）。8 核以上建议常开高精度。

            > 这是 v0.10.0 技术预览版。A/B/C 档 p95 门禁仍未达标，详见 README「延迟口径」。
