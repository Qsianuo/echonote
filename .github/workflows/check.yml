name: check

on:
  push:
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # NFR-CI-01: 3.10-3.13 on Linux plus one Windows run. 3.9 is
      # intentionally absent (end of life, and app/stt.py needs 3.10 unions).
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-dev.txt

      - name: Byte-compile
        run: python -m compileall -q app tests tools

      - name: Unit / contract / integration tests
        run: python -m pytest -q --cov=app --cov-report=term-missing

      # NFR-CI-02 coverage gates.
      - name: Coverage gate - vad >= 90%
        run: coverage report --include="app/vad.py" --fail-under=90

      - name: Coverage gate - stt >= 70%
        run: coverage report --include="app/stt.py" --fail-under=70

      - name: Coverage gate - main >= 60%
        run: coverage report --include="app/main.py" --fail-under=60

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax check
        run: |
          node --check web/app.js
          node --check web/export.js
          node --check web/wav.js
          node --check web/pcm-worklet.js
          node --check web/glossary.js
          node --check web/glossary-data.js
          node --check web/native-translate.js

      # RG-03 (WAV header) + RG-15 (export golden samples) + RG-41 (input gain)
      # + OPFS store, playback scheduler, waveform peaks.
      # 列出 tests/js/ 下全部文件：这里的列表是唯一的发现机制，新增文件忘了
      # 加进来就等于永远不跑（audio-store / playback / waveform 的 34 个用例
      # 此前就是这样漏掉的）。新增测试请同步追加。
      - name: Frontend unit tests
        run: >-
          node --test
          tests/js/export.test.mjs
          tests/js/wav.test.mjs
          tests/js/pcm-worklet.test.mjs
          tests/js/audio-store.test.mjs
          tests/js/playback.test.mjs
          tests/js/waveform.test.mjs
          tests/js/glossary.test.mjs

  runtime:
    name: runtime imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the real stack
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt

      - name: Import server and engine with real dependencies
        run: python -c "import app.main, app.stt; print(app.main.app.version)"
