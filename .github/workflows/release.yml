name: release

# Builds the portable Windows bundle and attaches it to a GitHub Release.
# Trigger: push a tag like v0.9.0, or run manually from the Actions tab.
#
# The build itself lives in packaging/build.ps1 so that a local build and a
# release build run identical steps (freeze -> smoke test -> zip).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the build to (e.g. v0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + packager
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Verify the app imports before freezing
        env:
          ECHONOTE_SKIP_PRELOAD: "1"
        run: python -c "from app.main import app; print(app.version)"

      - name: Build, smoke test and zip
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $ver = $tag -replace '^v', ''
          ./packaging/build.ps1 -Version $ver
          "ASSET=EchoNote-v$ver-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            ## 下载后怎么用

            1. 下载 `${{ env.ASSET }}`，解压到任意**可写目录**（例如 `D:\EchoNote`，不要放 `C:\Program Files`）
            2. **先双击 `fetch-model.bat`** 准备模型（实时字幕 145 MB + 定稿 1.5 GB，自动走国内镜像，只需一次）
            3. 双击 `EchoNote.exe`，会打开一个**独立的应用窗口**（没有地址栏和标签页），点麦克风开始录音
            4. 关闭应用窗口即退出；后台进程会在几秒后自行结束

            模型放进 `models\` 之后**识别全程零联网**。需要硬保证不联网时：

            ```
            EchoNote.exe --offline
            ```

            排查环境问题：

            ```
            EchoNote.exe --self-test
            ```

            全程本地识别，音频不上传任何服务器。

            ### v1.0.1：把「忘了改版本号」交给机器

            静态资源版本号此前散在四处手工维护：`index.html` 的 `?v=`、`app.js` 的
            `ASSET_VERSION`、以及两个原生模块的 import specifier。连续两个提交只改了
            HTML 忘了 JS，浏览器于是一直给旧缓存——录音链路的 worklet 会和源码对不上，
            排查起来极其误导。

            现在版本号由**资源内容哈希**派生，一条命令重写全部载体，pytest 兜住漂移。

            **顺带修掉一个安卓端的隐性 bug**：`native-vad.js` 曾被两个模块用不同的
            `?v=` 引入，浏览器按完整 URL 缓存模块，于是加载成了两份——两份 `MODES`
            对象、两个 `Segmenter` 类。桌面不走原生路径，所以一直没暴露。

            ### 关于本版本的两点说明

            1. 附件只重出了 **Windows 桌面包**。Android 包仍为 v1.0.0——本次不涉及识别
               行为变更，商店包无需重签。
            2. CI 的前端测试此前只跑 3 个文件、漏掉 34 个用例，现已补齐。

            ### 沿用 v1.0.0

            双端形态（Windows 便携包 / Android App）、SenseVoice 离线定稿 + zipformer
            流式字幕、会议/个人情境模式、边录边落盘与 30 秒窗口回放、四种导出格式。
            详细说明见 [v1.0.0](https://github.com/Qsianuo/echonote/releases/tag/v1.0.0)
            与 README。
